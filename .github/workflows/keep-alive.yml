name: Supabase Keep Alive

on:
  schedule:
    # Executa a cada 3 dias às 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite rodar manualmente se quiser testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Remove possíveis aspas extras ou espaços acidentais
          URL=$(echo "$SUPABASE_URL" | sed -e 's/^[[:space:]"'\''"]*//' -e 's/[[:space:]"'\''"]*$//')
          KEY=$(echo "$SUPABASE_ANON_KEY" | sed -e 's/^[[:space:]"'\''"]*//' -e 's/[[:space:]"'\''"]*$//')

          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::As secrets de URL e Chave Anon do Supabase não foram encontradas!"
            echo "Configure no GitHub (Settings > Secrets and variables > Actions > Secrets):"
            echo "  - SUPABASE_URL (ou VITE_SUPABASE_URL)"
            echo "  - SUPABASE_ANON_KEY (ou VITE_SUPABASE_ANON_KEY)"
            exit 1
          fi

          # Remove barra final da URL se houver
          BASE_URL="${URL%/}"

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$BASE_URL/rest/v1/")

          echo "Supabase HTTP Status: $STATUS"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Ping realizado com sucesso! Projeto Supabase mantido ativo."
          else
            echo "::warning::Status retornado foi $STATUS"
          fi
