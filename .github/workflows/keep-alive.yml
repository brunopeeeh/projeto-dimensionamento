name: Supabase Keep Alive

on:
  schedule:
    # Executa a cada 3 dias às 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite rodar manualmente se quiser testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST & Auth API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Limpeza de URL e KEY (remove aspas duplas, simples e espaços)
          CLEAN_URL=$(echo "$SUPABASE_URL" | tr -d '"' | tr -d "'" | xargs)
          CLEAN_KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '"' | tr -d "'" | xargs)

          if [ -z "$CLEAN_URL" ] || [ -z "$CLEAN_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL ou SUPABASE_ANON_KEY não encontradas."
            echo "Configure em Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          # Garante protocolo https:// caso tenha sido omitido
          if [[ ! "$CLEAN_URL" =~ ^https?:// ]]; then
            CLEAN_URL="https://$CLEAN_URL"
          fi

          # Remove barra final
          BASE_URL="${CLEAN_URL%/}"

          echo "1. Disparando ping para Auth Health ($BASE_URL/auth/v1/health)..."
          AUTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "$BASE_URL/auth/v1/health")
          echo "Auth Health Status: $AUTH_STATUS"

          echo "2. Disparando consulta ao banco Postgres via PostgREST..."
          REST_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "$BASE_URL/rest/v1/parametros_operacionais?select=mes_id&limit=1")
          echo "Database Rest Status: $REST_STATUS"

          if [ "$AUTH_STATUS" -eq 200 ] || [ "$REST_STATUS" -eq 200 ]; then
            echo "✅ Ping realizado com sucesso! Projeto Supabase e banco de dados ativos."
          else
            echo "::error::Falha no ping. Auth: $AUTH_STATUS, REST: $REST_STATUS"
            exit 1
          fi
