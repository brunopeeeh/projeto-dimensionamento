name: Supabase Keep Alive

on:
  schedule:
    # Executa a cada 3 dias às 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permite rodar manualmente se quiser testar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Supabase HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Ping realizado com sucesso!"
          else
            echo "Aviso: Status retornado foi $STATUS"
          fi
